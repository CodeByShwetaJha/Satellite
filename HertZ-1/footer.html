  color: rgba(255, 255, 255, 0.8) !important;

  background: #0a0a0a !important; /* SOLID COLOR - EXACT MATCH TO HEADER */

  box-shadow: none !important;

  background-color: #0a0a0a !important;

<script>
document.addEventListener('DOMContentLoaded', function() {
  console.log('🎯 Color-Matched Footer loaded successfully');
  
  // Force footer visibility and EXACT COLOR MATCH
  const footerContainer = document.querySelector('.footer-container');
  if (footerContainer) {
      footerContainer.style.display = 'block';
      footerContainer.style.visibility = 'visible';
      footerContainer.style.opacity = '1';
      footerContainer.style.position = 'relative';
      footerContainer.style.zIndex = '1000';
      footerContainer.style.textAlign = 'center';
      footerContainer.style.borderTop = 'none';
      footerContainer.style.boxShadow = 'none';
      
      // FORCE EXACT BACKGROUND COLOR TO MATCH HEADER
      footerContainer.style.background = '#0a0a0a';
      footerContainer.style.backgroundColor = '#0a0a0a';
      footerContainer.style.backgroundImage = 'none';
      
      console.log('✅ Color-Matched Footer visibility and color forced');
      
      // Log footer dimensions for debugging
      setTimeout(() => {
          const rect = footerContainer.getBoundingClientRect();
          const computedStyle = window.getComputedStyle(footerContainer);
          console.log('📏 Color-Matched Footer info:', {
              width: rect.width,
              height: rect.height,
              backgroundColor: computedStyle.backgroundColor,
              background: computedStyle.background
          });
      }, 100);
  } else {
      console.log('❌ Color-Matched Footer container not found');
  }
  
  // Force copyright text to be centered
  const copyrightText = document.querySelector('.footer-copyright p');
  if (copyrightText) {
      copyrightText.style.textAlign = 'center';
      copyrightText.style.width = '100%';
      copyrightText.style.display = 'block';
      copyrightText.style.border = 'none';
      copyrightText.style.background = 'transparent';
      console.log('✅ Copyright text forced to center');
  }
  
  // Auto-update year if needed
  const currentYear = new Date().getFullYear();
  if (copyrightText && currentYear > 2024) {
      copyrightText.innerHTML = copyrightText.innerHTML.replace('2024', currentYear);
      console.log('📅 Copyright year updated to:', currentYear);
  }
  
  // FORCE EXACT COLOR MATCH - REMOVE ANY COLOR DIFFERENCES
  setTimeout(() => {
      const footer = document.querySelector('.footer-container');
      if (footer) {
          // OVERRIDE ANY INHERITED STYLES
          footer.style.background = '#0a0a0a';
          footer.style.backgroundColor = '#0a0a0a';
          footer.style.backgroundImage = 'none';
          footer.style.backgroundGradient = 'none';
          
          // Remove any computed style conflicts
          const allFooterElements = document.querySelectorAll('.footer-container, .footer-content, .footer-grid, .footer-copyright, .footer-copyright p');
          allFooterElements.forEach(element => {
              element.style.border = 'none';
              element.style.borderTop = 'none';
              element.style.borderBottom = 'none';
              element.style.boxShadow = 'none';
              element.style.outline = 'none';
          });
          
          console.log('🎨 Footer color forced to exact match: #0a0a0a');
      }
  }, 200);
  
  // Simple visibility check
  const footerCheck = setInterval(() => {
      const footer = document.querySelector('.footer-container');
      if (footer) {
          const isVisible = footer.offsetHeight > 0 && 
                           getComputedStyle(footer).visibility !== 'hidden' && 
                           getComputedStyle(footer).display !== 'none';
          
          if (isVisible) {
              console.log('✅ Color-Matched Footer is visible and has height:', footer.offsetHeight);
              
              // DOUBLE-CHECK COLOR MATCH
              const bgColor = getComputedStyle(footer).backgroundColor;
              console.log('🎨 Footer background color:', bgColor);
              
              clearInterval(footerCheck);
          } else {
              console.log('⚠️ Color-Matched Footer exists but not visible, forcing visibility...');
              footer.style.display = 'block';
              footer.style.visibility = 'visible';
              footer.style.opacity = '1';
              footer.style.minHeight = '80px';
              footer.style.textAlign = 'center';
              footer.style.borderTop = 'none';
              footer.style.background = '#0a0a0a';
              footer.style.backgroundColor = '#0a0a0a';
          }
      }
  }, 500);
  
  // Clear check after 3 seconds
  setTimeout(() => clearInterval(footerCheck), 3000);
  
  console.log('✅ Color-Matched Footer initialization complete');
});
</script>
