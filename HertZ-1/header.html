<script>
document.addEventListener('DOMContentLoaded', function() {
  console.log('🎯 Header with LEFT Logo & RIGHT Navigation (Compact) loaded');
  
  // Mobile menu toggle
  const mobileToggle = document.getElementById('mobile-menu-toggle');
  const navMenu = document.getElementById('nav-menu');
  
  if (mobileToggle && navMenu) {
      mobileToggle.addEventListener('click', function() {
          navMenu.classList.toggle('active');
          this.textContent = navMenu.classList.contains('active') ? '✕' : '☰';
      });
  }
  
  // Close mobile menu when clicking outside
  document.addEventListener('click', function(e) {
      if (mobileToggle && navMenu && 
          !mobileToggle.contains(e.target) && 
          !navMenu.contains(e.target)) {
          navMenu.classList.remove('active');
          mobileToggle.textContent = '☰';
      }
  });
  
  // Handle navigation
  document.querySelectorAll('[data-page]').forEach(link => {
      link.addEventListener('click', function(e) {
          e.preventDefault();
          const page = this.getAttribute('data-page');
          
          // Update active states
          document.querySelectorAll('.nav-link').forEach(navLink => {
              navLink.classList.remove('active');
          });
          
          // Find and activate the correct nav link
          const activeLink = document.querySelector(`[data-page="${page}"].nav-link`);
          if (activeLink) {
              activeLink.classList.add('active');
          } else if (page.startsWith('products/')) {
              // Activate Products dropdown
              const productsLink = document.querySelector('.dropdown .nav-link');
              if (productsLink) {
                  productsLink.classList.add('active');
              }
          }
          
          // Close mobile menu
          if (navMenu && navMenu.classList.contains('active')) {
              navMenu.classList.remove('active');
              if (mobileToggle) mobileToggle.textContent = '☰';
          }
          
          // Navigate using the app router
          if (window.app && window.app.navigateToPage) {
              window.app.navigateToPage(page);
          } else {
              console.log('Navigate to:', page);
          }
      });
  });
  
  // Logo click handling
  document.querySelector('.logo').addEventListener('click', function(e) {
      e.preventDefault();
      
      // Update active states
      document.querySelectorAll('.nav-link').forEach(navLink => {
          navLink.classList.remove('active');
      });
      const homeLink = document.querySelector('[data-page="home"].nav-link');
      if (homeLink) homeLink.classList.add('active');
      
      // Close mobile menu
      if (navMenu && navMenu.classList.contains('active')) {
          navMenu.classList.remove('active');
          if (mobileToggle) mobileToggle.textContent = '☰';
      }
      
      if (window.app && window.app.navigateToPage) {
          window.app.navigateToPage('home');
      }
  });
  
  // Set initial active state
  const homeLink = document.querySelector('[data-page="home"].nav-link');
  if (homeLink) homeLink.classList.add('active');
});
</script>
