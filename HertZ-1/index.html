<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HertZ - Satellite Technology Solutions</title>
    
    <!-- Preload key fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;500;700;900&family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Include Global CSS -->
    <link rel="stylesheet" href="assets/css/global.css">
    
    <!-- Meta tags for SEO and sharing -->
    <meta name="description" content="HertZ - Leading provider of satellite technology solutions, sensor modules, computing units, and complete satellite systems for space exploration.">
    <meta name="keywords" content="satellite, space technology, sensor modules, computing units, satellite solutions, space exploration">
    <meta name="author" content="HertZ">
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="HertZ - Satellite Technology Solutions">
    <meta property="og:description" content="Pioneering the future of space technology with cutting-edge solutions.">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    
    <!-- Enhanced Loading Screen Styles -->
    <style>
        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1c 0%, #0d1117 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        
        .loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        
        /* Animated loader */
        .loader-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .satellite-loader {
            width: 80px;
            height: 80px;
            position: relative;
            margin-bottom: 2rem;
        }
        
        .satellite-body {
            width: 30px;
            height: 40px;
            background: linear-gradient(135deg, #74b9ff 0%, #4a90e2 100%);
            border-radius: 5px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.3);
        }
        
        .satellite-panels {
            width: 60px;
            height: 15px;
            background: linear-gradient(135deg, #2d5aa0 0%, #1e3f73 100%);
            border-radius: 2px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .orbit-ring {
            position: absolute;
            border: 2px solid rgba(74, 144, 226, 0.2);
            border-radius: 50%;
            animation: orbit 3s linear infinite;
        }
        
        .orbit-ring-1 {
            width: 80px;
            height: 80px;
            top: 0;
            left: 0;
        }
        
        .orbit-ring-2 {
            width: 60px;
            height: 60px;
            top: 10px;
            left: 10px;
            animation-direction: reverse;
            animation-duration: 2s;
        }
        
        @keyframes orbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .loading-title {
            font-size: 2rem;
            color: #74b9ff;
            font-weight: 800;
            margin-bottom: 0.5rem;
            font-family: 'Orbitron', sans-serif;
        }
        
        .loading-subtitle {
            font-size: 1rem;
            color: rgba(116, 185, 255, 0.7);
            font-weight: 400;
            font-family: 'Raleway', sans-serif;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* Loading progress bar */
        .progress-container {
            width: 200px;
            height: 3px;
            background: rgba(74, 144, 226, 0.2);
            border-radius: 2px;
            margin-top: 2rem;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #74b9ff, #4a90e2);
            border-radius: 2px;
            width: 0%;
            animation: loading-progress 2s ease-out forwards;
        }
        
        @keyframes loading-progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        /* Main content styling */
        #main-content {
            opacity: 0;
            transition: opacity 0.6s ease-in;
            min-height: calc(100vh - 110px);
            position: relative;
            z-index: 5;
        }
        
        #main-content.loaded {
            opacity: 1;
        }
        
        /* Error page styling */
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            color: #ffffff;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #74b9ff;
            text-shadow: 0 0 30px rgba(74, 144, 226, 0.3);
            font-family: 'Orbitron', sans-serif;
        }
        
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
            font-family: 'Raleway', sans-serif;
        }
        
        .error-description {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            max-width: 500px;
            line-height: 1.6;
            font-family: 'Raleway', sans-serif;
        }
        
        .error-button {
            background: linear-gradient(135deg, #74b9ff 0%, #4a90e2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Raleway', sans-serif;
        }
        
        .error-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .error-button:hover::before {
            left: 100%;
        }
        
        .error-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.3);
        }
        
        @media (max-width: 768px) {
            .error-code { font-size: 4rem; }
            .error-title { font-size: 2rem; }
            .error-description { font-size: 1rem; }
            .loading-title { font-size: 1.5rem; }
        }
        
        @media (max-width: 480px) {
            .satellite-loader { width: 60px; height: 60px; }
            .orbit-ring-1 { width: 60px; height: 60px; }
            .orbit-ring-2 { width: 45px; height: 45px; top: 7.5px; left: 7.5px; }
            .progress-container { width: 150px; }
        }
    </style>
</head>
<body>
    <!-- Professional Space Background from global.css -->
    <div class="nebula-clouds"></div>
    <div class="nebula-glow"></div>
    <div class="stars" id="stars"></div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-container">
            <div class="satellite-loader">
                <div class="orbit-ring orbit-ring-1"></div>
                <div class="orbit-ring orbit-ring-2"></div>
                <div class="satellite-panels"></div>
                <div class="satellite-body"></div>
            </div>
            <div class="loading-text">
                <h2 class="loading-title">HertZ</h2>
                <p class="loading-subtitle">Initializing satellite systems...</p>
            </div>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>
    
    <!-- Header will be loaded here by the app -->
    <div id="header-container"></div>
    
    <!-- Main content area where pages will load -->
    <main id="main-content" class="content-layer">
        <!-- Page content will be loaded here dynamically -->
        <div class="error-page">
            <div class="error-code">🚀</div>
            <h1 class="error-title">Initializing</h1>
            <p class="error-description">HertZ satellite systems are starting up...</p>
        </div>
    </main>
    
    <!-- Footer will be loaded here by the app -->
    <div id="footer-container"></div>

    <!-- Enhanced App JavaScript with Complete Router -->
    <script>
        console.log('🚀 HertZ - Advanced Satellite Technology Platform');

        // Modern App Class with Router
        class HertZApp {
            constructor() {
                this.currentPage = 'home';
                this.isLoading = false;
                this.onPageChange = null;
                
                // Initialize app
                this.init();
            }

            async init() {
                console.log('🔄 Initializing HertZ application...');
                
                try {
                    // Load header and footer concurrently
                    await Promise.all([
                        this.loadHeader(),
                        this.loadFooter()
                    ]);
                    
                    // Setup navigation
                    this.setupNavigation();
                    
                    // Handle initial route
                    this.handleInitialRoute();
                    
                    // Setup scroll animations
                    this.initScrollAnimations();
                    
                    // Hide loading screen
                    this.hideLoadingScreen();
                    
                    console.log('✅ HertZ application initialized successfully');
                    
                } catch (error) {
                    console.error('❌ Error initializing app:', error);
                    this.hideLoadingScreen();
                    this.showError('initialization');
                }
            }

            // ROUTER SYSTEM
            async loadPage(pageName) {
                try {
                    console.log(`📄 Loading page: ${pageName}`);
                    
                    // Determine the correct path based on page structure
                    let pagePath;
                    if (pageName.startsWith('products/')) {
                        // Products are in products subdirectory
                        pagePath = `pages/${pageName}.html`;
                    } else {
                        // Other pages are directly in pages directory
                        pagePath = `pages/${pageName}.html`;
                    }
                    
                    console.log(`🔍 Fetching from: ${pagePath}`);
                    
                    const response = await fetch(pagePath);
                    if (!response.ok) {
                        throw new Error(`Page not found: ${pagePath} (${response.status})`);
                    }
                    
                    const html = await response.text();
                    console.log(`📝 Page data length: ${html.length}`);
                    
                    // Get main content container
                    const contentContainer = document.getElementById('main-content');
                    if (!contentContainer) {
                        console.error('Main content container not found');
                        return;
                    }
                    
                    // Load content with fade effect
                    contentContainer.style.opacity = '0';
                    
                    setTimeout(() => {
                        contentContainer.innerHTML = html;
                        
                        // Execute page scripts with better error handling
                        this.executeScripts(html);
                        
                        // Fade in content
                        contentContainer.style.opacity = '1';
                        contentContainer.classList.add('loaded');
                        
                        // Update current page
                        this.currentPage = pageName;
                        
                        // Update URL
                        if (history.pushState && pageName !== 'home') {
                            history.pushState({page: pageName}, '', `#${pageName}`);
                        } else if (pageName === 'home') {
                            history.pushState({page: pageName}, '', './');
                        }
                        
                        // Update navigation active state
                        this.updateActiveNavigation(pageName);
                        
                        // Scroll to top
                        window.scrollTo({top: 0, behavior: 'smooth'});
                        
                        // Trigger page change callback
                        if (this.onPageChange) {
                            this.onPageChange();
                        }
                        
                        // Re-initialize scroll animations for new content
                        this.initScrollAnimations();
                        
                        console.log(`✅ Page loaded successfully: ${pageName}`);
                        
                    }, 200);
                    
                } catch (error) {
                    console.error(`❌ Error loading page ${pageName}:`, error);
                    this.showError(pageName);
                }
            }

            executeScripts(html) {
                console.log('🔧 Executing page scripts...');
                
                // Extract and execute scripts from loaded HTML
                const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                const srcScriptRegex = /<script[^>]*src=["']([^"']+)["'][^>]*><\/script>/gi;
                let match;
                let scriptCount = 0;
                
                // Handle external scripts first
                while ((match = srcScriptRegex.exec(html)) !== null) {
                    try {
                        const scriptSrc = match[1];
                        console.log(`📄 Loading external script: ${scriptSrc}`);
                        
                        const script = document.createElement('script');
                        script.src = scriptSrc;
                        script.onload = () => console.log(`✅ External script loaded: ${scriptSrc}`);
                        script.onerror = () => console.error(`❌ Failed to load external script: ${scriptSrc}`);
                        document.head.appendChild(script);
                        scriptCount++;
                        
                    } catch (error) {
                        console.error('Error loading external script:', error);
                    }
                }
                
                // Handle inline scripts
                const inlineScriptRegex = /<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi;
                while ((match = inlineScriptRegex.exec(html)) !== null) {
                    try {
                        const scriptContent = match[1];
                        if (scriptContent.trim()) {
                            console.log('📝 Executing inline script...');
                            
                            // Create and execute script
                            const script = document.createElement('script');
                            script.textContent = scriptContent;
                            document.head.appendChild(script);
                            scriptCount++;
                            
                            // Clean up after a delay
                            setTimeout(() => {
                                try {
                                    if (script.parentNode) {
                                        script.parentNode.removeChild(script);
                                    }
                                } catch (e) {
                                    // Script already removed or doesn't exist
                                }
                            }, 1000);
                        }
                    } catch (error) {
                        console.error('Error executing inline script:', error);
                    }
                }
                
                console.log(`🔧 Found ${scriptCount} scripts to execute`);
            }

            // PUBLIC NAVIGATION METHOD
            navigateToPage(pageName) {
                console.log(`🧭 Navigating to: ${pageName}`);
                this.loadPage(pageName);
            }

            // HEADER & FOOTER LOADING
            async loadHeader() {
                console.log('🌟 Router: Loading header...');
                try {
                    const response = await fetch('header.html');
                    if (!response.ok) throw new Error(`Header not found: ${response.status}`);
                    
                    const html = await response.text();
                    console.log(`📄 Router Header Response: ${response.status} ${response.url}`);
                    console.log(`📝 Router Header Data Length: ${html.length}`);
                    
                    let headerContainer = document.getElementById('header-container');
                    if (!headerContainer) {
                        console.log('📍 Router: Creating header container');
                        headerContainer = document.createElement('div');
                        headerContainer.id = 'header-container';
                        document.body.insertBefore(headerContainer, document.getElementById('main-content'));
                    }
                    
                    headerContainer.innerHTML = html;
                    console.log('✅ Router: Header HTML inserted');
                    
                    // Execute header scripts
                    const headerScripts = headerContainer.querySelectorAll('script');
                    console.log(`🔧 Router: Found ${headerScripts.length} header scripts`);
                    
                    headerScripts.forEach((oldScript, index) => {
                        try {
                            const newScript = document.createElement('script');
                            
                            if (oldScript.src) {
                                newScript.src = oldScript.src;
                                console.log(`📄 Router: Loading header script ${index + 1}: ${oldScript.src}`);
                            } else if (oldScript.textContent.trim()) {
                                newScript.textContent = oldScript.textContent;
                                console.log(`📝 Router: Executing header script ${index + 1} (inline)`);
                            }
                            
                            oldScript.remove();
                            document.head.appendChild(newScript);
                        } catch (error) {
                            console.error(`❌ Router: Error with header script ${index + 1}:`, error);
                        }
                    });
                    
                    console.log('✅ Router: Header loaded successfully');
                    
                    // Make header visible
                    headerContainer.style.opacity = '1';
                    
                } catch (error) {
                    console.error('❌ Router: Header loading failed:', error);
                }
            }

            async loadFooter() {
                console.log('🦶 Router: Starting automatic footer loading...');
                
                setTimeout(async () => {
                    console.log('🦶 Router: Loading footer automatically...');
                    try {
                        const response = await fetch('footer.html');
                        if (!response.ok) throw new Error(`Footer not found: ${response.status}`);
                        
                        const html = await response.text();
                        console.log(`📄 Router Footer Response: ${response.status} ${response.url}`);
                        console.log(`📝 Router Footer Data Length: ${html.length}`);
                        
                        let footerContainer = document.getElementById('footer-container');
                        if (!footerContainer) {
                            console.log('📍 Router: Created footer placeholder');
                            footerContainer = document.createElement('div');
                            footerContainer.id = 'footer-container';
                            document.body.appendChild(footerContainer);
                        }
                        
                        footerContainer.innerHTML = html;
                        console.log('✅ Router: Footer HTML inserted');
                        
                        // Execute footer scripts
                        const footerScripts = footerContainer.querySelectorAll('script');
                        console.log(`🔧 Router: Found ${footerScripts.length} footer scripts`);
                        
                        footerScripts.forEach((oldScript, index) => {
                            try {
                                const newScript = document.createElement('script');
                                Array.from(oldScript.attributes).forEach(attr => {
                                    newScript.setAttribute(attr.name, attr.value);
                                });
                                newScript.textContent = oldScript.textContent;
                                oldScript.remove();
                                footerContainer.appendChild(newScript);
                            } catch (error) {
                                console.error(`❌ Router: Error with footer script ${index + 1}:`, error);
                            }
                        });
                        
                        console.log('✅ Router: Footer loaded successfully');
                        
                        // Make footer visible
                        footerContainer.style.opacity = '1';
                        console.log('✅ Router: Footer made visible');
                        
                        // Log footer dimensions
                        const footerRect = footerContainer.getBoundingClientRect();
                        console.log('📏 Router Footer Dimensions:', {
                            height: footerRect.height,
                            width: footerRect.width,
                            visible: footerContainer.style.opacity
                        });
                        
                        // Adjust body padding for footer
                        document.body.style.paddingBottom = `${footerRect.height}px`;
                        console.log('📏 Body height with footer:', document.body.offsetHeight);
                        
                    } catch (error) {
                        console.error('❌ Router: Footer loading failed:', error);
                    }
                }, 1000);
            }

            // NAVIGATION SETUP
            setupNavigation() {
                console.log('🧭 Setting up navigation...');
                
                // Handle navigation clicks with better event delegation
                setTimeout(() => {
                    document.addEventListener('click', (e) => {
                        const navLink = e.target.closest('[data-page]');
                        if (navLink) {
                            e.preventDefault();
                            const page = navLink.getAttribute('data-page');
                            console.log(`🔗 Navigation clicked: ${page}`);
                            this.navigateToPage(page);
                        }
                    });
                    
                    // Handle browser back/forward
                    window.addEventListener('popstate', (e) => {
                        const page = e.state?.page || 'home';
                        console.log(`⬅️ Browser navigation: ${page}`);
                        this.loadPage(page);
                    });
                    
                    console.log('✅ Navigation handlers attached');
                }, 1000);
            }

            handleInitialRoute() {
                // Check URL hash for initial page
                const hash = window.location.hash.substring(1);
                const initialPage = hash || 'home';
                
                console.log(`🏠 Loading initial page: ${initialPage}`);
                this.loadPage(initialPage);
            }

            updateActiveNavigation(pageName) {
                // Update active navigation state
                setTimeout(() => {
                    const navLinks = document.querySelectorAll('[data-page]');
                    navLinks.forEach(link => {
                        const linkPage = link.getAttribute('data-page');
                        if (linkPage === pageName) {
                            link.classList.add('active');
                        } else {
                            link.classList.remove('active');
                        }
                    });
                }, 100);
            }

            showError(pageName) {
                const contentContainer = document.getElementById('main-content');
                if (contentContainer) {
                    contentContainer.innerHTML = `
                        <div class="error-page">
                            <div class="error-code">404</div>
                            <h1 class="error-title">Page Not Found</h1>
                            <p class="error-description">The page "${pageName}" could not be loaded. Please check the URL or try again.</p>
                            <button class="error-button" onclick="window.app.navigateToPage('home')">Return Home</button>
                        </div>
                    `;
                    contentContainer.style.opacity = '1';
                }
            }

            hideLoadingScreen() {
                setTimeout(() => {
                    const loadingScreen = document.getElementById('loading-screen');
                    if (loadingScreen) {
                        loadingScreen.classList.add('fade-out');
                        setTimeout(() => {
                            loadingScreen.remove();
                        }, 800);
                    }
                }, 1500);
            }

            initScrollAnimations() {
                // Initialize scroll-based animations
                const observerOptions = {
                    threshold: 0.1,
                    rootMargin: '0px 0px -100px 0px'
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate-in');
                        }
                    });
                }, observerOptions);

                // Observe elements with animation classes
                document.querySelectorAll('.animate-on-scroll').forEach(el => {
                    observer.observe(el);
                });
            }
        }

        // Initialize the app
        let app;

        document.addEventListener('DOMContentLoaded', () => {
            console.log('🌟 DOM loaded, starting HertZ application...');
            app = new HertZApp();
            
            // Make app globally available
            window.app = app;
            
            // Page visibility handling
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    console.log('🔄 Page visible - HertZ systems active');
                }
            });
        });

        // Global error handling
        window.addEventListener('error', (e) => {
            console.error('🚨 Global error:', e.error);
        });

        window.addEventListener('unhandledrejection', (e) => {
            console.error('🚨 Unhandled promise rejection:', e.reason);
        });

        console.log('🏁 HertZ application script loaded');
    </script>
</body>
</html>
